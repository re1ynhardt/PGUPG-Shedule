name: pgups_schedule
description: Неофициальное приложение расписания ПГУПС (rasp.pgups.ru)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  html: ^0.15.4
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  webview_flutter: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  # Можно задать отдельные иконки для платформ:
  # image_path_android: "assets/icon/android.png"
  # image_path_ios: "assets/icon/ios.png"
  
  # Для адаптивной иконки Android (Android 8+)
  adaptive_icon_background: "#ffffff"  # или путь к PNG
  adaptive_icon_foreground: "assets/icon/foreground.png"
  
  # Удалять старую иконку
  remove_alpha_ios: true